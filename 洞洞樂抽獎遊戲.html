<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>洞洞樂抽獎遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; overflow: hidden; }
        #setup-screen { max-width: 1200px; max-height: 95vh; overflow-y: auto; width: 95%; }
        .game-full-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-size: cover !important; background-position: center !important; position: relative; }
        .tight-table td, .tight-table th { padding: 4px 8px !important; line-height: 1.25 !important; }
        .poke-grid { display: grid; gap: 1px; padding: 10px; flex-grow: 1; width: 100%; height: 100%; overflow: hidden; box-sizing: border-box; }
        .hole { position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); box-sizing: border-box; }
        .paper-cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 2; background: rgba(255,255,255,0.3); transition: all 0.7s cubic-bezier(0.23, 1, 0.32, 1); backdrop-filter: blur(1px); user-select: none; }
        .cover-name, .prize-content { font-weight: 900; text-align: center; line-height: 1.1; padding: 4px; word-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; width: 90%; user-select: none; }
        .hole.poked .paper-cover { transform: scale(1.4) rotate(10deg); opacity: 0; pointer-events: none; filter: blur(10px); }
        .prize-content { z-index: 1; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.45); opacity: 0; transform: scale(0.9); transition: all 0.5s ease-out 0.15s; text-shadow: 0 0 8px rgba(255,255,255,0.8); }
        .hole.poked .prize-content { opacity: 1; transform: scale(1); }
        .toolbar-btn { background: rgba(0,0,0,0.7); color: white; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.2); white-space: nowrap; transition: 0.2s; }
        .toolbar-btn:hover { background: rgba(255,255,255,0.2); }
        #import-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .section-title { font-size: 1.125rem; font-weight: 700; color: #1f2937; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
    </style>
</head>
<body class="bg-gray-200 flex items-center justify-center">

    <div id="setup-screen" class="bg-white p-6 md:p-8 rounded-2xl shadow-2xl">
        <h1 class="text-2xl font-black text-center mb-8 text-red-600 border-b-2 pb-3">洞洞樂抽獎設定</h1>
        <div class="flex flex-col md:flex-row gap-8">
            <div class="w-full md:w-5/12 space-y-6">
                <div>
                    <h2 class="section-title">🧩 1. 格數設定</h2>
                    <div class="p-4 bg-gray-50 rounded-xl border border-gray-200 grid grid-cols-2 gap-3 text-sm">
                        <div><label class="text-gray-500 mb-1 block">橫向 (1~6)</label><select id="grid-cols" class="w-full border p-2 rounded-lg" onchange="generateInputFields()"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6" selected>6</option></select></div>
                        <div><label class="text-gray-500 mb-1 block">縱向 (1~5)</label><select id="grid-rows" class="w-full border p-2 rounded-lg" onchange="generateInputFields()"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option></select></div>
                    </div>
                </div>
                <div>
                    <h2 class="section-title">🎬 2. 多媒體與色彩自訂</h2>
                    <div class="p-4 bg-gray-50 rounded-xl border border-gray-200 space-y-3 text-[11px] font-bold text-gray-400">
                        <div>底圖 URL<input type="text" id="bg-url" class="w-full border p-2 rounded-lg text-black font-normal mt-1" value="https://img.freepik.com/premium-vector/red-chinese-new-year-background_317810-3835.jpg?semt=ais_hybrid&w=740&q=80"></div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>戳前顏色<input type="text" id="color-before" class="w-full border p-2 rounded-lg text-black font-normal mt-1" value="#FFDF00"></div>
                            <div>戳後顏色<input type="text" id="color-after" class="w-full border p-2 rounded-lg text-black font-normal mt-1" value="#FFDF00"></div>
                        </div>
                        <div>背景音樂<input type="text" id="music-url" class="w-full border p-2 rounded-lg text-black font-normal mt-1" value="https://cdn.pixabay.com/audio/2026/01/14/audio_3265c1aace.mp3"></div>
                        <div>音效 URL<input type="text" id="poke-sound-url" class="w-full border p-2 rounded-lg text-black font-normal mt-1" value="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></div>
                    </div>
                </div>
                <button onclick="startGame()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-4 rounded-xl text-xl shadow-lg transition active:scale-95">開始抽獎 🚀</button>
            </div>
            <div class="w-full md:w-7/12 flex flex-col">
                <div class="flex justify-between items-center mb-2"><h2 class="section-title">🎁 3. 獎項內容清單</h2><button onclick="openImportModal()" class="bg-blue-600 text-white px-2 py-1 rounded text-xs hover:bg-blue-700">📋 批次導入</button></div>
                <div class="border rounded-xl bg-white overflow-y-auto max-h-[550px] shadow-inner border-gray-200">
                    <table class="w-full text-left border-collapse tight-table text-[13px]"><thead class="sticky top-0 bg-gray-100 text-[12px] z-10 shadow-sm"><tr><th class="border-b w-12 text-center">編號</th><th class="border-b">顯示名稱</th><th class="border-b">獎項名稱</th></tr></thead><tbody id="prize-inputs"></tbody></table>
                </div>
            </div>
        </div>
    </div>

    <div id="import-modal"><div class="bg-white p-6 rounded-xl w-full max-w-lg shadow-2xl"><h3 class="text-xl font-bold mb-2">批次導入資料</h3><textarea id="import-data" class="w-full h-64 border rounded-lg p-3 text-sm font-mono mb-4 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="範例：第1格	獎項名稱"></textarea><div class="flex justify-end gap-3 text-sm"><button onclick="closeImportModal()" class="px-4 py-2 bg-gray-200 rounded">取消</button><button onclick="processImport()" class="px-4 py-2 bg-blue-600 text-white rounded">確認導入</button></div></div></div>

    <div id="game-screen" class="hidden game-full-container">
        <div class="h-14 bg-black/70 flex justify-end items-center px-4 gap-3 z-50 backdrop-blur-md">
            <button onclick="backToSetup()" class="toolbar-btn">⚙️ 設定</button>
            <button onclick="restartGame()" class="toolbar-btn">🔄 重新</button>
            <button id="toggle-music" onclick="toggleMusic()" class="toolbar-btn">🔊 音樂</button>
        </div>
        <div id="game-grid" class="poke-grid"></div>
        <audio id="bg-audio" loop></audio><audio id="drum-audio"></audio>
    </div>

    <script>
        let isMuted = false, currentPool = [];
        const $ = id => document.getElementById(id);

        function generateInputFields() {
            const count = parseInt($('grid-cols').value) * parseInt($('grid-rows').value);
            $('prize-inputs').innerHTML = Array.from({length: count}, (_, i) => `
                <tr class="hover:bg-blue-50"><td class="text-center font-bold bg-gray-50 text-gray-400">${i+1}</td>
                <td><input type="text" class="display-name w-full border rounded p-1 outline-none" placeholder="${i+1}"></td>
                <td><input type="text" class="prize-name w-full border rounded p-1 outline-none" placeholder="獎項內容"></td></tr>
            `).join('');
        }

        function openImportModal() { $('import-modal').style.display = 'flex'; }
        function closeImportModal() { $('import-modal').style.display = 'none'; }
        
        function processImport() {
            const lines = $('import-data').value.split('\n').filter(l => l.trim());
            const displays = document.querySelectorAll('.display-name'), prizes = document.querySelectorAll('.prize-name');
            lines.forEach((line, i) => {
                if (i >= displays.length) return;
                const parts = line.split(/\t| {2,}/);
                displays[i].value = parts[0]?.trim() || "";
                prizes[i].value = parts[1]?.trim() || "";
            });
            closeImportModal();
        }

        function startGame() {
            const displays = document.querySelectorAll('.display-name'), prizes = document.querySelectorAll('.prize-name');
            currentPool = Array.from(displays, (input, i) => ({
                displayName: input.value || (i + 1).toString(),
                prizeName: prizes[i].value || "銘謝惠顧"
            })).sort(() => Math.random() - 0.5);
            $('setup-screen').classList.add('hidden');
            $('game-screen').classList.remove('hidden');
            setTimeout(initDisplay, 50);
        }

        function restartGame() { currentPool.sort(() => Math.random() - 0.5); initDisplay(); }

        function initDisplay() {
            const bgUrl = $('bg-url').value.trim();
            $('game-screen').style.background = bgUrl ? `url('${bgUrl}')` : "#e0e0e0";
            $('drum-audio').src = $('poke-sound-url').value.trim();
            const audio = $('bg-audio');
            audio.src = $('music-url').value.trim();
            if (!isMuted) audio.play().catch(() => {});
            renderGrid();
        }

        function renderGrid() {
            const cols = parseInt($('grid-cols').value), rows = parseInt($('grid-rows').value);
            const grid = $('game-grid'), cB = $('color-before').value, cA = $('color-after').value;
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
            const fSize = `min(${(85/cols)}vw, ${(40/rows)}vh, 2.5rem)`;
            
            grid.innerHTML = currentPool.map(item => `
                <div class="hole" onclick="poke(this)">
                    <div class="paper-cover" style="color:${cB}"><span class="cover-name" style="font-size:${fSize}">${item.displayName}</span></div>
                    <div class="prize-content" style="font-size:${fSize};color:${cA}">${item.prizeName}</div>
                </div>
            `).join('');
        }

        function poke(el) {
            if (el.classList.contains('poked')) return;
            if (!isMuted) { const d = $('drum-audio'); d.currentTime = 0; d.play(); }
            el.classList.add('poked');
        }

        function toggleMusic() {
            isMuted = !isMuted;
            const a = $('bg-audio');
            isMuted ? a.pause() : a.play().catch(() => {});
            $('toggle-music').innerText = isMuted ? "🔇 靜音" : "🔊 音樂";
        }

        function backToSetup() { $('bg-audio').pause(); $('game-screen').classList.add('hidden'); $('setup-screen').classList.remove('hidden'); }
        window.onload = generateInputFields;
        window.onresize = () => { if (!$('game-screen').classList.contains('hidden')) renderGrid(); };
    </script>
</body>
</html>
