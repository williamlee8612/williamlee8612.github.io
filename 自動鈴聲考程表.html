<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動鈴聲考程表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        :root { --custom-gray: #4b5563; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f1f5f9; height: 100vh; width: 100vw; margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .digital-clock { font-family: 'JetBrains Mono', monospace; }
        
        /* 左側字級極大化與 Padding 壓縮 */
        .level-header-input { font-size: clamp(2.5rem, 4vw, 3.8rem); font-weight: 900; }
        .level-1-time { font-size: clamp(6rem, 12vw, 13rem); line-height: 0.9; font-weight: 700; }
        .level-date-text { font-size: clamp(2rem, 3.5vw, 4rem); font-weight: 700; }
        
        /* 狀態列文字放大 */
        .exam-row-text-status { font-size: clamp(2rem, 3vw, 3.5rem); font-weight: 900; line-height: 1; }
        .exam-row-text-title { font-size: clamp(2rem, 3vw, 3.5rem); font-weight: 800; line-height: 1; }
        .exam-row-text-time { font-size: clamp(1.8rem, 2.8vw, 3rem); font-weight: 700; line-height: 1; }

        .text-custom-gray { color: var(--custom-gray); }
        .main-container { height: 96vh; width: 98vw; display: flex; gap: 1rem; max-width: 1920px; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* 狀態區內部垂直置中邏輯 */
        .status-inner-wrapper { display: flex; flex-direction: column; justify-content: space-around; height: 100%; width: 100%; }
        .exam-status-grid { display: grid; grid-template-columns: 220px 1fr 320px; align-items: center; gap: 1.5rem; height: 100%; }
        
        /* 右側項目字級放大與 Padding 最小化 */
        .time-select { appearance: none; background: transparent; border: none; font-family: 'JetBrains Mono', monospace; font-weight: bold; color: #1e293b; cursor: pointer; padding: 0px 2px; text-align: center; font-size: 1.25rem; }
        .time-select:focus { outline: none; color: #2563eb; }
        .time-picker-box { background-color: #ffffff; padding: 2px 4px; border-radius: 0.5rem; border: 1px solid #e2e8f0; }
        .exam-input-name { font-size: 1.5rem; font-weight: 800; line-height: 1; padding: 2px 0; }
        .delete-btn { font-size: 1rem; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }

        /* 交錯行對比 */
        tbody tr:nth-child(even) { background-color: #f8fafc; }
    </style>
</head>
<body class="p-2 md:p-3">
    <main class="main-container">
        <!-- 左側：展示區 (60%) -->
        <section class="w-[60%] flex flex-col gap-3 h-full">
            <div class="bg-white rounded-3xl p-2 shadow-sm border border-slate-300 flex items-center justify-center shrink-0 h-[16%]">
                <input type="text" id="main-title" value="113學年度學科能力測驗" class="level-header-input text-slate-900 w-full bg-transparent outline-none border-none text-center">
            </div>
            
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-300 flex flex-col justify-center items-center text-center shrink-0 h-[44%]">
                <div id="current-date" class="level-date-text text-slate-600 mb-2">----年--月--日 星期-</div>
                <div id="current-time" class="level-1-time text-slate-900 tracking-tighter digital-clock">00:00:00</div>
                <div class="mt-4 flex items-center text-xl text-slate-500 font-black">
                    <span class="flex h-5 w-5 rounded-full bg-emerald-500 mr-3 animate-pulse"></span>系統時間同步中
                </div>
            </div>

            <div class="bg-white rounded-3xl px-6 py-0 shadow-sm border border-slate-300 flex flex-col flex-grow overflow-hidden">
                <div class="status-inner-wrapper">
                    <div class="exam-status-grid py-2">
                        <span id="status-label" class="exam-row-text-status px-2 py-2 rounded-2xl justify-center w-full border text-center">休息中</span>
                        <div id="current-exam-title" class="exam-row-text-title text-slate-900 truncate px-2">目前無考試</div>
                        <div id="current-exam-time" class="exam-row-text-time text-slate-600 digital-clock justify-end text-right">--:-- ~ --:--</div>
                    </div>
                    <div class="border-t-2 border-slate-200 w-full"></div>
                    <div class="exam-status-grid py-2">
                        <span class="exam-row-text-status text-slate-600 px-2 py-2 bg-slate-100 rounded-2xl justify-center w-full border border-slate-200 text-center">下一科</span>
                        <div id="next-exam-title" class="exam-row-text-title text-slate-700 truncate px-2">尚未排定</div>
                        <div id="next-exam-time" class="exam-row-text-time text-slate-500 digital-clock justify-end text-right">--:-- ~ --:--</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 右側：排程管理 (40%) -->
        <section class="w-[40%] flex flex-col bg-white rounded-3xl shadow-sm border border-slate-300 overflow-hidden h-full">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="text-xl font-black text-slate-800">考程設定與編輯</h3>
                <div class="flex gap-2">
                    <button onclick="sortExams()" class="px-3 py-1.5 text-slate-700 bg-white border border-slate-200 rounded-xl hover:bg-slate-100 font-bold text-xs shadow-sm">排序</button>
                    <button onclick="addExam()" class="px-4 py-1.5 bg-slate-800 text-white rounded-xl hover:bg-slate-700 font-bold text-xs shadow-sm">+ 新增</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar">
                <table class="w-full text-left table-fixed">
                    <thead class="sticky top-0 bg-slate-100 shadow-sm z-10">
                        <tr class="text-slate-700 border-b border-slate-200">
                            <th class="px-4 py-2 font-black w-[38%] text-[13px]">科目名稱</th>
                            <th class="px-2 py-2 font-black text-center w-[38%] text-[13px]">時間範圍</th>
                            <th class="px-1 py-2 font-black text-center w-[12%] text-[13px]">響鈴</th>
                            <th class="px-2 py-2 font-black text-center w-[12%] text-[13px]">操作</th>
                        </tr>
                    </thead>
                    <tbody id="exam-list" class="divide-y divide-slate-100"></tbody>
                </table>
                <div id="empty-state" class="p-10 text-center text-slate-500 hidden font-bold text-lg">目前無考程</div>
            </div>
            <div class="p-2 px-4 bg-slate-50 border-t border-slate-200">
                <div class="text-sm text-slate-700 font-black mb-1 px-1">自訂鈴聲設定 (MP3網址)</div>
                <div class="flex gap-2">
                    <input id="sound-url" type="text" class="w-[70%] text-sm p-2 rounded-xl border border-slate-200 outline-none focus:border-blue-500 bg-white shadow-inner" placeholder="請輸入 MP3 網址">
                    <div class="flex flex-1 gap-1">
                        <button onclick="testBell()" class="flex-1 px-1 py-2 bg-slate-700 text-white rounded-xl hover:bg-slate-800 font-bold text-xs shadow-sm transition">測試</button>
                        <button onclick="stopBell()" class="flex-1 px-1 py-2 bg-red-600 text-white rounded-xl hover:bg-red-700 font-bold text-xs shadow-sm transition">暫停</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <audio id="bell-audio" preload="auto"></audio>

    <script>
        let exams = [
            { id: 1, name: '預備鐘', start: '08:00', end: '08:10', bell: true },
            { id: 2, name: '英文科', start: '08:10', end: '09:00', bell: true }
        ];
        
        const DEFAULT_SOUND = "https://williamlee8612.github.io/上課鐘聲.mp3";
        const $ = (id) => document.getElementById(id);
        
        const toSec = (t) => {
            const [h, m, s = 0] = t.split(':').map(Number);
            return h * 3600 + m * 60 + s;
        };

        window.onload = () => {
            $('sound-url').value = DEFAULT_SOUND;
            $('bell-audio').src = DEFAULT_SOUND;
            renderExams();
            setInterval(tick, 1000);
            tick();
        };

        function tick() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            
            $('current-date').innerText = now.toLocaleDateString('zh-TW', {year:'numeric', month:'long', day:'numeric', weekday:'long'});
            $('current-time').innerText = `${h}:${m}:${s}`;

            if (s === "00") {
                const nowShort = `${h}:${m}`;
                if (exams.some(e => e.bell && (e.start === nowShort || e.end === nowShort))) playSound();
            }
            updateStatus(h, m, s);
        }

        function updateStatus(h, m, s) {
            const nowTotal = toSec(`${h}:${m}:${s}`);
            const sorted = [...exams].sort((a, b) => a.start.localeCompare(b.start));
            let cur = null, nxt = null;

            for (let i = 0; i < sorted.length; i++) {
                const sStart = toSec(sorted[i].start), sEnd = toSec(sorted[i].end);
                if (nowTotal >= sStart && nowTotal < sEnd) {
                    cur = sorted[i]; nxt = sorted[i+1]; break;
                } else if (nowTotal < sStart) {
                    nxt = sorted[i]; break;
                }
            }

            const lbl = $('status-label');
            if (cur) {
                lbl.innerText = "考試中";
                lbl.className = `exam-row-text-status px-2 py-2 rounded-2xl justify-center w-full transition-all text-red-700 bg-red-50 border-red-200 border shadow-sm text-center`;
            } else {
                lbl.innerText = "休息中";
                lbl.className = `exam-row-text-status px-2 py-2 rounded-2xl justify-center w-full transition-all text-blue-700 bg-blue-50 border-blue-200 border shadow-sm text-center`;
            }
            
            $('current-exam-title').innerText = cur ? cur.name : "目前無考試項目";
            $('current-exam-time').innerText = cur ? `${cur.start} ~ ${cur.end}` : "--:-- ~ --:--";
            $('next-exam-title').innerText = nxt ? nxt.name : "今日考程結束";
            $('next-exam-time').innerText = nxt ? `${nxt.start} ~ ${nxt.end}` : "--:-- ~ --:--";
        }

        function renderExams() {
            const list = $('exam-list');
            list.innerHTML = '';
            $('empty-state').classList.toggle('hidden', exams.length > 0);

            exams.forEach(e => {
                const conflict = exams.some(o => o.id !== e.id && (toSec(e.start) < toSec(o.end) && toSec(e.end) > toSec(o.start)));
                const tr = document.createElement('tr');
                tr.className = `group hover:bg-blue-50/50 transition ${conflict ? 'bg-red-50' : ''}`;
                
                const warningTag = conflict 
                    ? `<span class="ml-1 flex-shrink-0 bg-red-600 text-white text-[10px] px-1.5 py-0.5 rounded-md font-black animate-pulse shadow-md">重疊</span>` 
                    : '';

                tr.innerHTML = `
                    <td class="px-4 py-1">
                        <div class="flex items-center w-full">
                            <input type="text" value="${e.name}" 
                                onchange="updateE(${e.id},'name',this.value)" 
                                class="bg-transparent exam-input-name text-slate-800 flex-grow outline-none focus:text-blue-700 truncate min-w-0"
                            >
                            ${warningTag}
                        </div>
                    </td>
                    <td class="px-2 py-1 text-center">
                        <div class="flex items-center justify-center gap-x-0.5">
                            ${timePicker(e.id, e.start, 'start')} <span class="text-slate-400 font-bold">-</span> ${timePicker(e.id, e.end, 'end')}
                        </div>
                    </td>
                    <td class="px-1 py-1 text-center">
                        <input type="checkbox" ${e.bell ? 'checked' : ''} onchange="updateE(${e.id},'bell',this.checked)" class="w-6 h-6 text-blue-600 cursor-pointer accent-blue-600">
                    </td>
                    <td class="px-2 py-1 text-center">
                        <button onclick="delE(${e.id})" class="delete-btn mx-auto text-slate-400 hover:text-red-600 border border-slate-200 bg-white transition-all font-bold shadow-sm">✕</button>
                    </td>`;
                list.appendChild(tr);
            });
        }

        function timePicker(id, val, field) {
            const [h, m] = val.split(':');
            const opt = (max, sel) => Array.from({length: max}, (_, i) => {
                const v = String(i).padStart(2, '0');
                return `<option value="${v}" ${v === sel ? 'selected' : ''}>${v}</option>`;
            }).join('');
            return `
                <div class="inline-flex items-center time-picker-box hover:border-blue-400 transition-colors">
                    <select class="time-select" onchange="updateT(${id},'${field}','h',this.value)">${opt(24, h)}</select>
                    <span class="text-slate-400 font-bold text-sm">:</span>
                    <select class="time-select" onchange="updateT(${id},'${field}','m',this.value)">${opt(60, m)}</select>
                </div>`;
        }

        function updateT(id, f, p, v) {
            const e = exams.find(x => x.id === id);
            let [h, m] = e[f].split(':');
            p === 'h' ? h = v : m = v;
            updateE(id, f, `${h}:${m}`);
        }

        function updateE(id, f, v) { exams.find(x => x.id === id)[f] = v; renderExams(); }
        function delE(id) { exams = exams.filter(e => e.id !== id); renderExams(); }
        function addExam() { exams.push({ id: Date.now(), name: '新考科', start: '08:00', end: '09:00', bell: true }); renderExams(); }
        function sortExams() { exams.sort((a, b) => a.start.localeCompare(b.start)); renderExams(); }
        function playSound() { 
            const a = $('bell-audio'); a.src = $('sound-url').value || DEFAULT_SOUND;
            a.currentTime = 0; a.play().catch(()=>{}); 
        }
        function testBell() { playSound(); }
        function stopBell() { 
            const a = $('bell-audio'); 
            a.pause(); 
            a.currentTime = 0; 
        }
    </script>
</body>
</html>
