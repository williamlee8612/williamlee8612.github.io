<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考試考程與鐘聲系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        :root { --custom-gray: #7B7B7B; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; height: 100vh; width: 100vw; margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .digital-clock { font-family: 'JetBrains Mono', monospace; }
        .level-header-input { font-size: clamp(1.8rem, 2.5vw, 2.5rem); font-weight: 900; }
        .level-1-time { font-size: clamp(4rem, 8vw, 7.5rem); line-height: 1.2; font-weight: 700; }
        .exam-row-text { font-size: clamp(1.3rem, 1.8vw, 2rem); font-weight: 800; line-height: 1.3; display: flex; align-items: center; }
        .text-custom-gray { color: var(--custom-gray); }
        .main-container { height: 96vh; width: 98vw; display: flex; gap: 1.5rem; max-width: 1920px; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .status-inner-wrapper { display: grid; grid-template-rows: 1fr auto 1fr; height: 100%; width: 100%; }
        .exam-status-grid { display: grid; grid-template-columns: 140px 1fr 240px; align-items: center; gap: 1.5rem; height: 100%; }
        .time-select { appearance: none; background: transparent; border: none; font-family: 'JetBrains Mono', monospace; font-weight: bold; color: #475569; cursor: pointer; padding: 1px 2px; text-align: center; font-size: 0.9rem; }
        .time-select:focus { outline: none; color: #2563eb; }
        .time-picker-box { background-color: #f1f5f9; padding: 0.1rem 0.2rem; border-radius: 0.5rem; border: 1px solid #e2e8f0; }
        .compact-table td { padding: 0.3rem 0 !important; vertical-align: middle; }
        .exam-input-name { font-size: 1.15rem; font-weight: 700; }
        .delete-btn { font-size: 0.7rem; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
    </style>
</head>
<body class="p-2 md:p-4">
    <main class="main-container">
        <!-- 左側：展示區 -->
        <section class="w-1/2 flex flex-col gap-4 h-full">
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 flex items-center justify-center shrink-0 h-[15%]">
                <input type="text" id="main-title" value="113學年度學科能力測驗" class="level-header-input text-slate-800 w-full bg-transparent outline-none border-none text-center">
            </div>
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 flex flex-col justify-center items-center text-center flex-[1.5]">
                <div id="current-date" class="text-xl md:text-2xl text-custom-gray mb-4 font-medium">----年--月--日 星期-</div>
                <div id="current-time" class="level-1-time text-slate-900 tracking-tighter digital-clock">00:00:00</div>
                <div class="mt-6 flex items-center text-sm text-custom-gray font-bold">
                    <span class="flex h-2.5 w-2.5 rounded-full bg-green-500 mr-2 animate-pulse"></span>系統時間同步中
                </div>
            </div>
            <div class="bg-white rounded-3xl px-10 shadow-sm border border-slate-200 flex flex-col flex-1">
                <div class="status-inner-wrapper">
                    <div class="exam-status-grid">
                        <span id="status-label" class="exam-row-text px-3 py-1 rounded-xl justify-center w-full">休息中</span>
                        <div id="current-exam-title" class="exam-row-text text-slate-800 truncate px-2">目前無考試</div>
                        <div id="current-exam-time" class="exam-row-text text-custom-gray digital-clock justify-end">--:-- ~ --:--</div>
                    </div>
                    <div class="border-t border-slate-100 w-full"></div>
                    <div class="exam-status-grid">
                        <span class="exam-row-text text-custom-gray px-3 py-1 bg-slate-100 rounded-xl justify-center w-full">下一科</span>
                        <div id="next-exam-title" class="exam-row-text text-slate-600 truncate px-2">尚未排定</div>
                        <div id="next-exam-time" class="exam-row-text text-custom-gray digital-clock justify-end">--:-- ~ --:--</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 右側：排程管理 -->
        <section class="w-1/2 flex flex-col bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden h-full">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 class="text-2xl font-black text-slate-800">考程設定</h3>
                <div class="flex gap-2">
                    <button onclick="sortExams()" class="px-3 py-1.5 text-custom-gray bg-white border border-slate-200 rounded-xl hover:bg-slate-100 font-bold text-xs shadow-sm">自動排序</button>
                    <button onclick="addExam()" class="px-4 py-1.5 bg-slate-800 text-white rounded-xl hover:bg-slate-700 font-bold text-xs shadow-sm">新增科目</button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar">
                <table class="w-full text-left table-fixed">
                    <thead class="sticky top-0 bg-white shadow-sm z-10">
                        <tr class="text-custom-gray border-b border-slate-100">
                            <th class="px-6 py-4 font-black w-[48%] text-xs">考試科目</th>
                            <th class="px-2 py-4 font-black text-center w-[30%] text-xs">時間範圍</th>
                            <th class="px-2 py-4 font-black text-center w-[10%] text-xs">鐘聲</th>
                            <th class="px-4 py-4 font-black text-center w-[12%] text-xs">操作</th>
                        </tr>
                    </thead>
                    <tbody id="exam-list" class="divide-y divide-slate-50"></tbody>
                </table>
                <div id="empty-state" class="p-16 text-center text-custom-gray hidden font-bold">目前無考程</div>
            </div>
            <div class="p-5 bg-slate-50 border-t border-slate-100">
                <div class="text-[11px] text-custom-gray font-bold mb-2 px-1">音檔網址 (MP3 URL)</div>
                <div class="flex gap-3">
                    <input id="sound-url" type="text" class="flex-1 text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-400 bg-white shadow-inner">
                    <button onclick="testBell()" class="px-5 py-2.5 bg-blue-500 text-white rounded-xl hover:bg-blue-600 font-bold text-sm shadow-sm transition">測試播放</button>
                </div>
            </div>
        </section>
    </main>

    <audio id="bell-audio" preload="auto"></audio>

    <script>
        let exams = [
            { id: 1, name: '預備鐘', start: '08:00', end: '08:10', bell: true },
            { id: 2, name: '英文科', start: '08:10', end: '09:00', bell: true }
        ];
        
        const DEFAULT_SOUND = "https://williamlee8612.github.io/上課鐘聲.mp3";
        const $ = (id) => document.getElementById(id);
        
        // 修正後的秒數轉換函數
        const toSec = (t) => {
            const [h, m, s = 0] = t.split(':').map(Number);
            return h * 3600 + m * 60 + s;
        };

        window.onload = () => {
            $('sound-url').value = DEFAULT_SOUND;
            $('bell-audio').src = DEFAULT_SOUND;
            renderExams();
            setInterval(tick, 1000);
            tick();
        };

        function tick() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            
            $('current-date').innerText = now.toLocaleDateString('zh-TW', {year:'numeric', month:'long', day:'numeric', weekday:'long'});
            $('current-time').innerText = `${h}:${m}:${s}`;

            if (s === "00") {
                const nowShort = `${h}:${m}`;
                if (exams.some(e => e.bell && (e.start === nowShort || e.end === nowShort))) playSound();
            }
            updateStatus(h, m, s);
        }

        function updateStatus(h, m, s) {
            const nowTotal = toSec(`${h}:${m}:${s}`);
            const sorted = [...exams].sort((a, b) => a.start.localeCompare(b.start));
            let cur = null, nxt = null;

            for (let i = 0; i < sorted.length; i++) {
                const sStart = toSec(sorted[i].start), sEnd = toSec(sorted[i].end);
                if (nowTotal >= sStart && nowTotal < sEnd) {
                    cur = sorted[i]; nxt = sorted[i+1]; break;
                } else if (nowTotal < sStart) {
                    nxt = sorted[i]; break;
                }
            }

            const lbl = $('status-label');
            lbl.innerText = cur ? "考試中" : "休息中";
            lbl.className = `exam-row-text px-3 py-1 rounded-xl justify-center w-full ${cur ? 'text-red-600 bg-red-50' : 'text-blue-600 bg-blue-50'}`;
            
            $('current-exam-title').innerText = cur ? cur.name : "目前無考試";
            $('current-exam-time').innerText = cur ? `${cur.start} ~ ${cur.end}` : "--:-- ~ --:--";
            $('next-exam-title').innerText = nxt ? nxt.name : "今日考程結束";
            $('next-exam-time').innerText = nxt ? `${nxt.start} ~ ${nxt.end}` : "--:-- ~ --:--";
        }

        function renderExams() {
            const list = $('exam-list');
            list.innerHTML = '';
            $('empty-state').classList.toggle('hidden', exams.length > 0);

            exams.forEach(e => {
                const conflict = exams.some(o => o.id !== e.id && (toSec(e.start) < toSec(o.end) && toSec(e.end) > toSec(o.start)));
                const tr = document.createElement('tr');
                tr.className = `group hover:bg-slate-50 transition ${conflict ? 'bg-red-50' : ''}`;
                tr.innerHTML = `
                    <td class="px-6 py-2">
                        <input type="text" value="${e.name}" onchange="updateE(${e.id},'name',this.value)" class="bg-transparent exam-input-name text-slate-700 w-full outline-none focus:text-blue-600 truncate">
                        ${conflict ? '<div class="text-[10px] text-red-500 font-bold">⚠️ 時間重疊</div>' : ''}
                    </td>
                    <td class="px-2 py-2 text-center">
                        <div class="flex items-center justify-center space-x-1">
                            ${timePicker(e.id, e.start, 'start')} <span class="text-slate-300">~</span> ${timePicker(e.id, e.end, 'end')}
                        </div>
                    </td>
                    <td class="px-2 py-2 text-center">
                        <input type="checkbox" ${e.bell ? 'checked' : ''} onchange="updateE(${e.id},'bell',this.checked)" class="w-4 h-4 text-blue-600 cursor-pointer">
                    </td>
                    <td class="px-4 py-2 text-center">
                        <button onclick="delE(${e.id})" class="delete-btn mx-auto text-slate-300 hover:text-red-500 border border-slate-200 bg-white transition-all font-bold">✕</button>
                    </td>`;
                list.appendChild(tr);
            });
        }

        function timePicker(id, val, field) {
            const [h, m] = val.split(':');
            const opt = (max, sel) => Array.from({length: max}, (_, i) => {
                const v = String(i).padStart(2, '0');
                return `<option value="${v}" ${v === sel ? 'selected' : ''}>${v}</option>`;
            }).join('');
            return `
                <div class="inline-flex items-center space-x-1 time-picker-box">
                    <select class="time-select" onchange="updateT(${id},'${field}','h',this.value)">${opt(24, h)}</select>
                    <span class="text-slate-400 font-bold">:</span>
                    <select class="time-select" onchange="updateT(${id},'${field}','m',this.value)">${opt(60, m)}</select>
                </div>`;
        }

        function updateT(id, f, p, v) {
            const e = exams.find(x => x.id === id);
            let [h, m] = e[f].split(':');
            p === 'h' ? h = v : m = v;
            updateE(id, f, `${h}:${m}`);
        }

        function updateE(id, f, v) { exams.find(x => x.id === id)[f] = v; renderExams(); }
        function delE(id) { exams = exams.filter(e => e.id !== id); renderExams(); }
        function addExam() { exams.push({ id: Date.now(), name: '新項目', start: '08:00', end: '09:00', bell: true }); renderExams(); }
        function sortExams() { exams.sort((a, b) => a.start.localeCompare(b.start)); renderExams(); }
        function playSound() { 
            const a = $('bell-audio'); a.src = $('sound-url').value || DEFAULT_SOUND;
            a.currentTime = 0; a.play().catch(()=>{}); 
        }
        function testBell() { playSound(); }
    </script>
</body>
</html>
