<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>承智教育 | 打卡系統</title>

  <!-- 1. 引入 Google Fonts Noto Sans TC（確保跨作業系統中文字體顯示一致且不亂碼） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- 2. 引入 FontAwesome 6.5.1 圖示庫 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <!-- 3. 引入 Tailwind CSS CDN（輔助排版工具） -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 4. 獨立元件樣式表（禁用 :root 全域變數，所有尺寸、顏色、間距皆明確宣告於各自 Class 中） -->
  <style>
    /* 全局盒模型重置 */
    * {
      box-sizing: border-box;
    }

    /* 整頁鎖定單一視窗高度、禁止外層出現捲軸 */
    html,
    body.page-viewport-shell {
      width: 100%;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F1F5F9;
      color: #1E293B;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── 頂部導覽列 (Header Bar：固定高度 64px、深藍專業底色 #1E468A) ── */
    .sys-header-bar {
      width: 100%;
      height: 64px;
      background-color: #1E468A;
      color: #FFFFFF;
      padding-left: 16px;
      padding-right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.12);
      flex-shrink: 0;
      z-index: 50;
    }

    @media (min-width: 640px) {
      .sys-header-bar {
        padding-left: 24px;
        padding-right: 24px;
      }
    }

    /* 左側系統標題（規範字級 24px、字重 600） */
    .sys-header-title {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }

    .sys-header-title-icon {
      font-size: 22px;
      color: #BFDBFE;
    }

    /* 右側功能控制區 */
    .sys-header-right-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 連線狀態指示膠囊 */
    .sys-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 9999px;
      background-color: rgba(255, 255, 255, 0.12);
      font-size: 13px;
      font-weight: 600;
      color: #BFDBFE;
    }

    .sys-status-pill.is-loading {
      color: #F59E0B;
    }

    .sys-status-pill.is-ready {
      color: #34D399;
    }

    .sys-status-pill.is-error {
      color: #FCA5A5;
    }

    /* 頂部列功能按鈕（更新名單 / 音效開關） */
    .sys-header-btn {
      background-color: rgba(255, 255, 255, 0.12);
      color: #BFDBFE;
      border: 1px solid rgba(191, 219, 254, 0.25);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .sys-header-btn:hover {
      background-color: #1E3A8A;
      color: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
    }

    /* ── 主內容工作區（寬度 98% 自適應、填滿剩餘視窗高度、無外層捲動） ── */
    .main-stage-wrapper {
      width: 98%;
      max-width: 98%;
      height: calc(100vh - 64px);
      margin: 0 auto;
      padding-top: 12px;
      padding-bottom: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 左右雙欄網格配置（左側 46% 操作區、右側 54% 紀錄區） */
    .main-split-grid {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      overflow: hidden;
    }

    @media (min-width: 900px) {
      .main-split-grid {
        grid-template-columns: 46fr 54fr;
      }
    }

    /* 左側垂直堆疊容器 */
    .left-control-column {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      overflow: hidden;
    }

    /* 右側紀錄面板容器 */
    .right-history-column {
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    /* ── 模組 1：大字報風格動態時鐘卡片（放大區域佔比與字級） ── */
    .poster-clock-card {
      flex: 1.15;
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
      min-height: 0;
    }

    .poster-clock-date {
      font-size: clamp(18px, 1.8vw, 28px);
      font-weight: 700;
      color: #64748B;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .poster-clock-time {
      font-size: clamp(50px, 5.4vw, 90px);
      font-weight: 900;
      color: #1E293B;
      line-height: 1.05;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }

    .poster-clock-colon {
      animation: clockBlinkAnim 1s step-end infinite;
    }

    @keyframes clockBlinkAnim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    /* ── 模組 2：數據統計摘要卡片 ── */
    .stats-bar-card {
      flex-shrink: 0;
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    .stats-cell-box {
      flex: 1;
      text-align: center;
    }

    .stats-cell-num {
      font-size: clamp(24px, 2.2vw, 34px);
      font-weight: 800;
      color: #1E293B;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .stats-cell-num.is-in-num {
      color: #047857;
    }

    .stats-cell-num.is-out-num {
      color: #B91C1C;
    }

    .stats-cell-label {
      font-size: 13px;
      font-weight: 600;
      color: #64748B;
      margin-top: 2px;
    }

    .stats-cell-sep {
      width: 1px;
      height: 36px;
      background-color: #E2E8F0;
    }

    /* ── 模組 3：打卡操作主卡片（支援成功綠光暈 / 失敗紅光暈閃爍回饋） ── */
    .checkin-box-card {
      flex: 1;
      background-color: #FFFFFF;
      border: 2px solid #E2E8F0;
      border-radius: 10px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
      min-height: 0;
    }

    /* 打卡成功時卡片外框亮綠色光暈 */
    .checkin-box-card.card-glow-success {
      border-color: #10B981;
      box-shadow: 0 0 0 5px rgba(16, 185, 129, 0.22);
    }

    /* 打卡失敗時卡片外框亮紅色光暈 */
    .checkin-box-card.card-glow-error {
      border-color: #EF4444;
      box-shadow: 0 0 0 5px rgba(239, 68, 68, 0.22);
    }

    /* 進班 / 離班 切換按鈕群組 */
    .mode-switch-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .mode-choice-btn {
      padding: 12px 14px;
      border-radius: 10px;
      border: 2px solid #E2E8F0;
      background-color: #F8FAFC;
      color: #64748B;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .mode-choice-btn:hover:not(:disabled) {
      border-color: #CBD5E1;
      color: #1E293B;
      transform: translateY(-2px);
      box-shadow: 0 4px 6px rgba(15, 23, 42, 0.08);
    }

    .mode-choice-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .mode-choice-btn.active-in-mode {
      background-color: #ECFDF5;
      border-color: #10B981;
      color: #047857;
    }

    .mode-choice-btn.active-out-mode {
      background-color: #FEF2F2;
      border-color: #EF4444;
      color: #B91C1C;
    }

    /* 學號輸入列 */
    .id-input-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .id-input-caption {
      font-size: 20px;
      font-weight: 800;
      color: #1E293B;
      white-space: nowrap;
    }

    .id-text-field {
      flex: 1;
      width: 100%;
      background-color: #FFFFFF;
      border: 2px solid #CBD5E1;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 22px;
      font-weight: 800;
      color: #1E293B;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    /* Focus 亮主色邊框光暈 (#3B82F6) */
    .id-text-field:focus {
      border-color: #3B82F6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
    }

    .id-text-field:disabled {
      background-color: #F1F5F9;
      color: #64748B;
      cursor: not-allowed;
    }

    .id-text-field::placeholder {
      font-size: 16px;
      font-weight: 500;
      color: #94A3B8;
    }

    .id-text-field.field-warn-border {
      border-color: #EF4444;
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.18);
    }

    /* 送出打卡按鈕 */
    .id-submit-btn {
      background-color: #1E468A;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .id-submit-btn:hover:not(:disabled) {
      background-color: #1E3A8A;
      transform: translateY(-2px);
      box-shadow: 0 4px 6px rgba(30, 70, 138, 0.25);
    }

    .id-submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* 狀態回饋區塊 */
    .status-banner-row {
      border-top: 1px solid #E2E8F0;
      padding-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
    }

    .status-banner-label {
      font-size: 16px;
      font-weight: 700;
      color: #64748B;
      white-space: nowrap;
    }

    .status-banner-body {
      flex: 1;
    }

    .status-ready-text {
      font-size: 16px;
      font-weight: 600;
      color: #64748B;
    }

    .status-busy-text {
      font-size: 16px;
      font-weight: 700;
      color: #1E468A;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* 規範圓角 Alert 提示樣式（成功 #ECFDF5/#047857、失敗 #FEF2F2/#B91C1C） */
    .status-alert-box {
      width: 100%;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: statusPopIn 0.18s ease-out;
    }

    @keyframes statusPopIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .status-alert-box.is-success {
      background-color: #ECFDF5;
      color: #047857;
      border: 1px solid #A7F3D0;
    }

    .status-alert-box.is-error {
      background-color: #FEF2F2;
      color: #B91C1C;
      border: 1px solid #FECACA;
    }

    .status-alert-box.is-warning {
      background-color: #FFFBEB;
      color: #B45309;
      border: 1px solid #FDE68A;
    }

    /* ── 模組 4：右側即時打卡紀錄面板（最小 Padding、放大字級、僅內部可上下捲動） ── */
    .history-panel-card {
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
      min-height: 0;
      overflow: hidden;
    }

    .history-panel-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 4px;
      padding-right: 4px;
      flex-shrink: 0;
    }

    .history-panel-heading {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #1E293B;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .history-panel-heading-icon {
      color: #1E468A;
    }

    .history-clear-btn {
      background-color: #FFFFFF;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      color: #64748B;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .history-clear-btn:hover {
      border-color: #EF4444;
      color: #B91C1C;
      background-color: #FEF2F2;
      transform: translateY(-2px);
      box-shadow: 0 4px 6px rgba(15, 23, 42, 0.08);
    }

    /* 進班 / 離班 雙欄外框 */
    .history-dual-board {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      overflow: hidden;
      min-height: 0;
    }

    /* 單一紀錄欄位（全頁面唯一開放上下捲動的區域） */
    .history-scroll-lane {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .history-scroll-lane.has-right-border {
      border-right: 1px solid #E2E8F0;
    }

    /* 固定欄位標題列（緊湊內距 + 放大字級） */
    .history-lane-header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 6px 10px;
      font-size: 16px;
      font-weight: 800;
      background-color: #F8FAFC;
      border-bottom: 1px solid #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .history-lane-header.lane-in-color {
      color: #047857;
    }

    .history-lane-header.lane-out-color {
      color: #B91C1C;
    }

    /* 單筆打卡資料列（最小 Padding + 放大字級 + 隔行變色） */
    .history-record-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 10px;
      border-bottom: 1px solid #E2E8F0;
      background-color: #FFFFFF;
    }

    .history-record-item:nth-child(odd) {
      background-color: #F8FAFC;
    }

    .history-item-main {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .history-item-time {
      font-size: 16px;
      font-weight: 700;
      color: #64748B;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .history-item-divider {
      color: #CBD5E1;
      font-size: 14px;
    }

    .history-item-name {
      font-size: 19px;
      font-weight: 800;
      color: #1E293B;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item-id {
      font-size: 14px;
      font-weight: 700;
      color: #64748B;
      background-color: #F1F5F9;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 無資料純文字提示 */
    .history-empty-note {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      color: #94A3B8;
      text-align: center;
    }
  </style>
</head>
<body class="page-viewport-shell">

  <!-- ── 頂部列 (Header Bar：64px 深藍專業風格) ── -->
  <header class="sys-header-bar">
    <h1 class="sys-header-title">
      <i class="fa-solid fa-address-card sys-header-title-icon"></i>
      <span>承智教育 | 打卡系統</span>
    </h1>

    <div class="sys-header-right-group">
      <!-- 系統連線狀態燈號 -->
      <div class="sys-status-pill is-loading" id="header-conn-pill">
        <i class="fa-solid fa-circle-notch fa-spin" id="header-conn-icon"></i>
        <span id="header-conn-label">連線中</span>
      </div>

      <!-- 重新整理名單快取按鈕（櫃台新增新生後可立即同步） -->
      <button type="button" class="sys-header-btn" id="btn-sync-roster" onclick="syncRosterCache()" title="同步最新學生名單">
        <i class="fa-solid fa-rotate" id="icon-sync-roster"></i>
        <span class="hidden sm:inline">更新名單</span>
      </button>

      <!-- 提示音效開關按鈕 -->
      <button type="button" class="sys-header-btn" id="btn-toggle-audio" onclick="toggleAudioState()" title="切換打卡提示音效">
        <i class="fa-solid fa-volume-high" id="icon-audio-state"></i>
        <span class="hidden sm:inline" id="text-audio-state">音效開</span>
      </button>
    </div>
  </header>

  <!-- ── 主工作區 (寬度 98% 滿版無捲動) ── -->
  <main class="main-stage-wrapper">
    <div class="main-split-grid">

      <!-- 左側欄位：大字報時鐘、統計摘要、打卡操作區 -->
      <section class="left-control-column">

        <!-- 1. 大字報動態時鐘卡片 -->
        <div class="poster-clock-card">
          <div class="poster-clock-date" id="big-clock-date">載入中...</div>
          <div class="poster-clock-time">
            <span id="big-clock-h">00</span><span class="poster-clock-colon">:</span><span id="big-clock-m">00</span><span class="poster-clock-colon">:</span><span id="big-clock-s">00</span>
          </div>
        </div>

        <!-- 2. 打卡統計卡片 -->
        <div class="stats-bar-card">
          <div class="stats-cell-box">
            <div class="stats-cell-num" id="stat-total-num">0</div>
            <div class="stats-cell-label">累計打卡</div>
          </div>
          <div class="stats-cell-sep"></div>
          <div class="stats-cell-box">
            <div class="stats-cell-num is-in-num" id="stat-in-num">0</div>
            <div class="stats-cell-label">進班人數</div>
          </div>
          <div class="stats-cell-sep"></div>
          <div class="stats-cell-box">
            <div class="stats-cell-num is-out-num" id="stat-out-num">0</div>
            <div class="stats-cell-label">離班人數</div>
          </div>
        </div>

        <!-- 3. 打卡操作與狀態回饋卡片 -->
        <div class="checkin-box-card" id="checkin-action-panel">
          <!-- 進班 / 離班 切換按鈕 -->
          <div class="mode-switch-row">
            <button type="button" class="mode-choice-btn active-in-mode" id="btn-select-in" onclick="selectMode('進班')">
              <i class="fa-solid fa-right-to-bracket"></i>
              <span>進班</span>
            </button>
            <button type="button" class="mode-choice-btn" id="btn-select-out" onclick="selectMode('離班')">
              <i class="fa-solid fa-right-from-bracket"></i>
              <span>離班</span>
            </button>
          </div>

          <!-- 學號輸入與送出列 -->
          <div class="id-input-group">
            <label for="student-id-box" class="id-input-caption">學號：</label>
            <input
              type="text"
              id="student-id-box"
              class="id-text-field"
              inputmode="numeric"
              placeholder="請輸入學號"
              autocomplete="off"
            >
            <button type="button" id="btn-do-checkin" class="id-submit-btn" onclick="executeCheckin()">
              <i class="fa-solid fa-check" id="icon-do-checkin"></i>
              <span id="text-do-checkin">打卡</span>
            </button>
          </div>

          <!-- 打卡結果狀態欄 -->
          <div class="status-banner-row">
            <span class="status-banner-label">狀態：</span>
            <div class="status-banner-body" id="status-banner-slot">
              <span class="status-ready-text">請輸入學號並按 Enter</span>
            </div>
          </div>
        </div>

      </section>

      <!-- 右側欄位：即時打卡紀錄（頁面重整即清空，僅列表內部可上下捲動） -->
      <section class="right-history-column">
        <div class="history-panel-card">
          <div class="history-panel-top">
            <h2 class="history-panel-heading">
              <i class="fa-solid fa-list-check history-panel-heading-icon"></i>
              <span>即時打卡紀錄</span>
            </h2>
            <button type="button" class="history-clear-btn" onclick="clearHistoryList()">
              <i class="fa-solid fa-trash-can"></i>
              <span>清除紀錄</span>
            </button>
          </div>

          <!-- 進班 / 離班 雙欄列表 -->
          <div class="history-dual-board">
            <!-- 左欄：進班紀錄 -->
            <div class="history-scroll-lane has-right-border" id="lane-in-records">
              <div class="history-lane-header lane-in-color">
                <span>進班紀錄</span>
                <span>0 筆</span>
              </div>
              <div class="history-empty-note">尚無進班紀錄</div>
            </div>

            <!-- 右欄：離班紀錄 -->
            <div class="history-scroll-lane" id="lane-out-records">
              <div class="history-lane-header lane-out-color">
                <span>離班紀錄</span>
                <span>0 筆</span>
              </div>
              <div class="history-empty-note">尚無離班紀錄</div>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- ── 前端互動與 API 串接腳本 ── -->
  <script>
    /**
     * 集中管理之 GAS Web App 部署網址
     */
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzGAHgtncmlUEllkPl_CwRzsVcVg1z_d8r17XPXWjU6zLSoKXd6z5XTR9Gz6nC7lZkTvQ/exec';

    /**
     * 系統執行期狀態變數（頁面重新整理即自動重置）
     */
    let activeMode = '進班';           // 目前選擇模式：'進班' 或 '離班'
    let isProcessing = false;          // 查詢處理鎖定旗標（防止連點與處理中重複送出）
    let audioEnabled = true;           // 提示音效開關狀態
    let bannerResetTimer = null;       // 狀態提示文字自動復原計時器
    let cardGlowTimer = null;          // 卡片外框光暈復原計時器
    let historyRecords = [];           // 目前頁面暫存紀錄陣列

    const WEEKDAY_LIST = ['日', '一', '二', '三', '四', '五', '六'];

    /**
     * 兩位數補零格式化
     * @param {number} n - 整數
     * @returns {string} 補零後字串
     */
    function pad2(n) {
      return n < 10 ? '0' + n : String(n);
    }

    /**
     * HTML 特殊字元跳脫（防止 XSS 攻擊）
     * @param {string} raw - 原始文字
     * @returns {string} 安全 HTML 字串
     */
    function escapeHtml(raw) {
      return String(raw)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /**
     * 更新左上大字報動態時鐘（每秒執行一次）
     */
    function refreshBigClock() {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth() + 1;
      const d = now.getDate();
      const w = WEEKDAY_LIST[now.getDay()];

      document.getElementById('big-clock-date').textContent = `${y} 年 ${m} 月 ${d} 日（週${w}）`;
      document.getElementById('big-clock-h').textContent = pad2(now.getHours());
      document.getElementById('big-clock-m').textContent = pad2(now.getMinutes());
      document.getElementById('big-clock-s').textContent = pad2(now.getSeconds());
    }

    /**
     * Web Audio API 提示音效產生器（免外部音效檔、無延遲）
     * @param {'success'|'error'} kind - 音效種類
     */
    function playTone(kind) {
      if (!audioEnabled) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        if (kind === 'success') {
          // 成功音效：輕快雙音階上升
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.setValueAtTime(880.00, ctx.currentTime + 0.09);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.26);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.26);
        } else {
          // 失敗音效：低沉雙短音提醒
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(240, ctx.currentTime);
          osc.frequency.setValueAtTime(185, ctx.currentTime + 0.13);
          gain.gain.setValueAtTime(0.22, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.30);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.30);
        }
      } catch (e) {
        // 忽略瀏覽器未互動前之音訊播放限制
      }
    }

    /**
     * 切換音效開關狀態
     */
    function toggleAudioState() {
      audioEnabled = !audioEnabled;
      const icon = document.getElementById('icon-audio-state');
      const text = document.getElementById('text-audio-state');

      if (audioEnabled) {
        icon.className = 'fa-solid fa-volume-high';
        text.textContent = '音效開';
        playTone('success');
      } else {
        icon.className = 'fa-solid fa-volume-xmark';
        text.textContent = '靜音中';
      }
      focusStudentInput();
    }

    /**
     * 將焦點安全放回學號輸入框（若未處於查詢鎖定狀態）
     */
    function focusStudentInput() {
      const inputEl = document.getElementById('student-id-box');
      if (inputEl && !inputEl.disabled) {
        inputEl.focus();
      }
    }

    /**
     * 更新頂部列連線狀態燈號
     * @param {'loading'|'ready'|'error'} state - 燈號狀態
     * @param {string} label - 顯示文字
     */
    function setHeaderConnPill(state, label) {
      const pill = document.getElementById('header-conn-pill');
      const icon = document.getElementById('header-conn-icon');
      const text = document.getElementById('header-conn-label');

      pill.className = 'sys-status-pill is-' + state;
      text.textContent = label;

      if (state === 'loading') {
        icon.className = 'fa-solid fa-circle-notch fa-spin';
      } else if (state === 'ready') {
        icon.className = 'fa-solid fa-circle-check';
      } else {
        icon.className = 'fa-solid fa-circle-xmark';
      }
    }

    /**
     * 頁面載入時執行連線健康檢查
     */
    async function initServerConnection() {
      setHeaderConnPill('loading', '連線中');
      try {
        const res = await fetch(GAS_URL, {
          method: 'GET',
          redirect: 'follow'
        });
        const json = await res.json();
        if (json && json.success) {
          setHeaderConnPill('ready', '已連線');
          focusStudentInput();
        } else {
          setHeaderConnPill('error', '連線異常');
        }
      } catch (err) {
        setHeaderConnPill('error', '無法連線');
      }
    }

    /**
     * 手動通知後端更新學生名單快取（櫃台新增學生後使用，個資不回傳至前端）
     */
    async function syncRosterCache() {
      if (isProcessing) return;
      const syncIcon = document.getElementById('icon-sync-roster');
      syncIcon.classList.add('fa-spin');
      setHeaderConnPill('loading', '更新中');

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          redirect: 'follow',
          body: JSON.stringify({
            action: 'refreshCheckinCache',
            data: {}
          })
        });
        const json = await res.json();
        if (json && json.code === 200 && json.success) {
          setHeaderConnPill('ready', '已連線');
          showStatusBanner('success', '學生名單已更新完成');
        } else {
          setHeaderConnPill('error', '更新失敗');
          showStatusBanner('error', (json && json.message) || '名單更新失敗');
        }
      } catch (err) {
        setHeaderConnPill('error', '連線異常');
        alert('無法連線至伺服器，請稍後再試。');
      } finally {
        syncIcon.classList.remove('fa-spin');
        focusStudentInput();
      }
    }

    /**
     * 切換「進班」與「離班」模式
     * @param {'進班'|'離班'} mode - 目標模式
     */
    function selectMode(mode) {
      if (isProcessing) return;
      activeMode = mode;
      document.getElementById('btn-select-in').className = 'mode-choice-btn' + (mode === '進班' ? ' active-in-mode' : '');
      document.getElementById('btn-select-out').className = 'mode-choice-btn' + (mode === '離班' ? ' active-out-mode' : '');
      focusStudentInput();
    }

    /**
     * 讓左側操作卡片外框短暫亮起綠色或紅色光暈
     * @param {'success'|'error'} glowType - 光暈顏色類型
     */
    function triggerCardGlow(glowType) {
      const panel = document.getElementById('checkin-action-panel');
      if (cardGlowTimer) {
        clearTimeout(cardGlowTimer);
        cardGlowTimer = null;
      }
      panel.classList.remove('card-glow-success', 'card-glow-error');
      // 強制瀏覽器重繪以確保連續觸發時動畫重新啟動
      void panel.offsetWidth;
      panel.classList.add(glowType === 'success' ? 'card-glow-success' : 'card-glow-error');

      cardGlowTimer = setTimeout(() => {
        panel.classList.remove('card-glow-success', 'card-glow-error');
      }, 1500);
    }

    /**
     * 更新操作卡片底部的狀態提示欄
     * @param {'idle'|'busy'|'success'|'error'|'warning'} state - 狀態類型
     * @param {string} msg - 顯示訊息
     */
    function showStatusBanner(state, msg) {
      const slot = document.getElementById('status-banner-slot');
      if (bannerResetTimer) {
        clearTimeout(bannerResetTimer);
        bannerResetTimer = null;
      }

      if (state === 'idle') {
        slot.innerHTML = '<span class="status-ready-text">請輸入學號並按 Enter</span>';
        return;
      }

      if (state === 'busy') {
        slot.innerHTML = '<span class="status-busy-text"><i class="fa-solid fa-spinner fa-spin"></i>處理中，請稍候...</span>';
        return;
      }

      const iconLookup = {
        success: 'fa-circle-check',
        error: 'fa-circle-xmark',
        warning: 'fa-triangle-exclamation'
      };

      slot.innerHTML = `
        <div class="status-alert-box is-${state}">
          <i class="fa-solid ${iconLookup[state]}"></i>
          <span>${escapeHtml(msg)}</span>
        </div>
      `;

      bannerResetTimer = setTimeout(() => {
        showStatusBanner('idle');
      }, 3500);
    }

    /**
     * 鎖定或解鎖輸入介面（查詢期間完全鎖定，防止連點或重疊送出）
     * @param {boolean} locked - true 為鎖定、false 為開放下一筆輸入
     */
    function setFormLockState(locked) {
      isProcessing = locked;
      const inputEl = document.getElementById('student-id-box');
      const submitBtn = document.getElementById('btn-do-checkin');
      const submitIcon = document.getElementById('icon-do-checkin');
      const submitText = document.getElementById('text-do-checkin');
      const btnIn = document.getElementById('btn-select-in');
      const btnOut = document.getElementById('btn-select-out');

      inputEl.disabled = locked;
      submitBtn.disabled = locked;
      btnIn.disabled = locked;
      btnOut.disabled = locked;

      if (locked) {
        submitIcon.className = 'fa-solid fa-spinner fa-spin';
        submitText.textContent = '查詢中';
      } else {
        submitIcon.className = 'fa-solid fa-check';
        submitText.textContent = '打卡';
      }
    }

    /**
     * 空白輸入提醒閃爍
     */
    function flashEmptyInput() {
      const inputEl = document.getElementById('student-id-box');
      inputEl.classList.add('field-warn-border');
      focusStudentInput();
      setTimeout(() => {
        inputEl.classList.remove('field-warn-border');
      }, 700);
    }

    /**
     * 執行打卡送出程序
     */
    async function executeCheckin() {
      // 防連點：若正在查詢處理中，直接忽略任何點擊或 Enter
      if (isProcessing) return;

      const inputEl = document.getElementById('student-id-box');
      const studentId = inputEl.value.trim();

      if (!studentId) {
        flashEmptyInput();
        showStatusBanner('warning', '請先輸入學號');
        return;
      }

      // 立即鎖定表單，直到本筆結果處理完畢才開放下一筆
      setFormLockState(true);
      showStatusBanner('busy');

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          redirect: 'follow',
          body: JSON.stringify({
            action: 'checkin',
            data: {
              studentId: studentId,
              type: activeMode
            }
          })
        });

        const result = await response.json();

        if (result.code === 200 && result.success) {
          // 200：打卡成功
          playTone('success');
          triggerCardGlow('success');
          setHeaderConnPill('ready', '已連線');
          showStatusBanner('success', `${result.data.name} ${result.data.type}成功！`);
          addRecordToScreen({
            studentId: result.data.studentId,
            name: result.data.name,
            type: result.data.type,
            time: result.data.shortTime
          });
        } else if (result.code === 400 || result.code === 404) {
          // 400 / 404：查無學號或輸入錯誤
          playTone('error');
          triggerCardGlow('error');
          showStatusBanner('error', result.message || '查無此學號，請重新確認');
        } else {
          // 500：伺服器異常
          playTone('error');
          triggerCardGlow('error');
          setHeaderConnPill('error', '系統異常');
          showStatusBanner('error', result.message || '系統發生異常');
          alert('系統發生異常，請通知櫃台人員：\n' + (result.message || '資料寫入失敗'));
        }
      } catch (error) {
        // 網路斷線或無法連線
        playTone('error');
        triggerCardGlow('error');
        setHeaderConnPill('error', '網路異常');
        showStatusBanner('error', '無法連線，請檢查網路');
        alert('網路連線異常，請確認網路狀態後再試一次。');
      } finally {
        // 本筆處理完全結束：解鎖表單、清空輸入框並自動聚焦，開放下一位學生輸入
        setFormLockState(false);
        inputEl.value = '';
        focusStudentInput();
      }
    }

    /**
     * 將成功紀錄加入畫面列表頂端並更新統計數字
     * @param {{studentId: string, name: string, type: string, time: string}} item - 紀錄資料
     */
    function addRecordToScreen(item) {
      historyRecords.unshift(item);
      renderHistoryLanes();
    }

    /**
     * 清除目前畫面上的打卡紀錄
     */
    function clearHistoryList() {
      if (historyRecords.length === 0) {
        focusStudentInput();
        return;
      }
      if (!confirm('確定要清除畫面上的打卡紀錄嗎？')) {
        focusStudentInput();
        return;
      }
      historyRecords = [];
      renderHistoryLanes();
      focusStudentInput();
    }

    /**
     * 渲染統計數據與左右雙欄紀錄列表
     */
    function renderHistoryLanes() {
      const inList = historyRecords.filter(r => r.type === '進班');
      const outList = historyRecords.filter(r => r.type === '離班');

      document.getElementById('stat-total-num').textContent = historyRecords.length;
      document.getElementById('stat-in-num').textContent = inList.length;
      document.getElementById('stat-out-num').textContent = outList.length;

      const buildRowsHtml = (rows, emptyText) => {
        if (rows.length === 0) {
          return `<div class="history-empty-note">${escapeHtml(emptyText)}</div>`;
        }
        return rows.map(r => `
          <div class="history-record-item">
            <div class="history-item-main">
              <span class="history-item-time">${escapeHtml(r.time)}</span>
              <span class="history-item-divider">|</span>
              <span class="history-item-name">${escapeHtml(r.name)}</span>
            </div>
            <span class="history-item-id">${escapeHtml(r.studentId)}</span>
          </div>
        `).join('');
      };

      document.getElementById('lane-in-records').innerHTML = `
        <div class="history-lane-header lane-in-color">
          <span>進班紀錄</span>
          <span>${inList.length} 筆</span>
        </div>
        ${buildRowsHtml(inList, '尚無進班紀錄')}
      `;

      document.getElementById('lane-out-records').innerHTML = `
        <div class="history-lane-header lane-out-color">
          <span>離班紀錄</span>
          <span>${outList.length} 筆</span>
        </div>
        ${buildRowsHtml(outList, '尚無離班紀錄')}
      `;
    }

    /**
     * 監聽學號輸入框 Enter 鍵（查詢鎖定期間不觸發）
     */
    document.getElementById('student-id-box').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!isProcessing) {
          executeCheckin();
        }
      }
    });

    /**
     * 全域自動聚焦防呆：點擊畫面任何非按鈕區域時，游標自動跳回學號輸入框
     */
    document.addEventListener('click', function (e) {
      if (e.target.closest('button') || e.target.closest('input')) {
        return;
      }
      focusStudentInput();
    });

    /**
     * 頁面啟動初始化
     */
    refreshBigClock();
    setInterval(refreshBigClock, 1000);
    renderHistoryLanes();
    initServerConnection();
  </script>
</body>
</html>
